
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practrep | Mi examen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #142541;
            color: white;
            padding: 25px 8%;
            font-size: 25px;
            font-weight: bold;
        }

        header span {
            color: #55a6ff;
        }

        main {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .contenedor {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
        }

        .icono {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #17365e;
            margin-bottom: 15px;
            font-size: 32px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .boton {
            display: inline-block;
            background: #2878e5;
            color: white;
            text-decoration: none;
            padding: 16px 30px;
            border-radius: 9px;
            font-weight: bold;
            transition: .3s;
        }

        .boton:hover {
            background: #165bb5;
            transform: translateY(-2px);
        }

        footer {
            background: #142541;
            color: #cbd5e1;
            text-align: center;
            padding: 22px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        PRACT<span>REP</span>
    </header>

    <main>
        <div class="contenedor">

            <div class="icono">📝</div>

            <h1>Mi proyecto de examen</h1>

            <p>
                Bienvenido a la presentación de mi proyecto.
                En esta página podrás visualizar el examen
                que he desarrollado.
            </p>

            <a href="./examen.html" class="boton">
                Ver mi examen →
            </a>

        </div>
    </main>

    <footer>
        © 2026 PRACTREP | Proyecto académico
    </footer>

</body>
</html>
